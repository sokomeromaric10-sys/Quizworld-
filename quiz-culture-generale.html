<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — L'Afrique & le Monde</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d14;
    --card: #13131f;
    --border: #2a2a3d;
    --gold: #f0c040;
    --gold2: #e8a020;
    --text: #e8e4f0;
    --muted: #7a7a9a;
    --correct: #3ecf8e;
    --wrong: #e85050;
    --accent: #7c5cfc;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(124,92,252,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    bottom: -200px; right: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(240,192,64,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .container {
    width: 100%;
    max-width: 680px;
  }

  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 40px;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 6vw, 3.2rem);
    font-weight: 900;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -1px;
    line-height: 1;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 6px;
  }

  /* PROGRESS */
  .progress-bar {
    background: var(--border);
    border-radius: 99px;
    height: 4px;
    margin-bottom: 28px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--gold));
    border-radius: 99px;
    transition: width 0.5s ease;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 8px;
  }

  /* CARD */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 40px;
    position: relative;
    overflow: hidden;
    animation: slideIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.5;
  }

  .category-tag {
    display: inline-block;
    background: rgba(124,92,252,0.15);
    border: 1px solid rgba(124,92,252,0.3);
    color: #a98ef8;
    font-size: 0.72rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 99px;
    margin-bottom: 20px;
  }

  .question {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.1rem, 3vw, 1.45rem);
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 32px;
    color: var(--text);
  }

  /* OPTIONS */
  .options {
    display: grid;
    gap: 12px;
  }

  .option {
    background: rgba(255,255,255,0.03);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .option:hover:not(.disabled) {
    border-color: var(--accent);
    background: rgba(124,92,252,0.08);
    transform: translateX(4px);
  }

  .option-letter {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--muted);
    flex-shrink: 0;
    transition: all 0.2s;
  }

  .option-text {
    font-size: 0.95rem;
    font-weight: 400;
    line-height: 1.35;
  }

  .option.correct {
    border-color: var(--correct);
    background: rgba(62,207,142,0.08);
    animation: pulse-correct 0.4s ease;
  }

  .option.correct .option-letter {
    background: var(--correct);
    color: #0d0d14;
  }

  .option.wrong {
    border-color: var(--wrong);
    background: rgba(232,80,80,0.08);
  }

  .option.wrong .option-letter {
    background: var(--wrong);
    color: white;
  }

  .option.disabled { cursor: default; pointer-events: none; }

  @keyframes pulse-correct {
    0% { transform: scale(1); }
    50% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }

  /* EXPLANATION */
  .explanation {
    margin-top: 20px;
    padding: 14px 18px;
    background: rgba(240,192,64,0.06);
    border-left: 3px solid var(--gold);
    border-radius: 0 8px 8px 0;
    font-size: 0.88rem;
    color: #c8c0a0;
    line-height: 1.5;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* NEXT BTN */
  .next-btn {
    display: block;
    width: 100%;
    margin-top: 24px;
    padding: 16px;
    background: linear-gradient(135deg, var(--accent), #5a3cdc);
    color: white;
    border: none;
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    animation: fadeIn 0.3s ease;
  }

  .next-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .next-btn:active { transform: translateY(0); }

  /* SCORE */
  .score-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 52px 40px;
    text-align: center;
    animation: slideIn 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .score-emoji {
    font-size: 4rem;
    display: block;
    margin-bottom: 16px;
    animation: bounce 0.6s ease;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    40% { transform: translateY(-18px); }
    60% { transform: translateY(-8px); }
  }

  .score-title {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 900;
    margin-bottom: 10px;
  }

  .score-subtitle {
    color: var(--muted);
    margin-bottom: 36px;
    font-size: 0.9rem;
  }

  .score-circle {
    width: 130px; height: 130px;
    border-radius: 50%;
    border: 3px solid var(--gold);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    margin: 0 auto 36px;
    background: rgba(240,192,64,0.06);
    box-shadow: 0 0 40px rgba(240,192,64,0.1);
  }

  .score-num {
    font-family: 'Playfair Display', serif;
    font-size: 2.6rem;
    font-weight: 900;
    color: var(--gold);
    line-height: 1;
  }

  .score-denom {
    color: var(--muted);
    font-size: 0.85rem;
  }

  .restart-btn {
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    color: #0d0d14;
    border: none;
    border-radius: 12px;
    padding: 16px 40px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }

  .restart-btn:hover { opacity: 0.9; transform: translateY(-2px); }

  /* TIMER */
  .timer {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }

  .timer-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--correct);
    animation: blink 1s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .timer.warning { color: var(--wrong); }
  .timer.warning .timer-dot { background: var(--wrong); }

  @media (max-width: 520px) {
    .card, .score-card { padding: 28px 22px; }
  }
</style>

// Shuffle
const shuffled = [...questions].sort(() => Math.random() - 0.5);
let current = 0, score = 0, answered = false;
let timerInterval = null, timeLeft = 20;
const letters = ['A', 'B', 'C', 'D'];

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = 20;
  updateTimer();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimer();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      if (!answered) autoFail();
    }
  }, 1000);
}

function updateTimer() {
  const el = document.getElementById('timer');
  if (!el) return;
  el.textContent = `${timeLeft}s`;
  el.parentElement.className = 'timer' + (timeLeft <= 5 ? ' warning' : '');
  const dot = el.parentElement.querySelector('.timer-dot');
  if (dot) dot.style.background = timeLeft <= 5 ? 'var(--wrong)' : 'var(--correct)';
}

function autoFail() {
  answered = true;
  const q = shuffled[current];
  document.querySelectorAll('.option').forEach((el, i) => {
    el.classList.add('disabled');
    if (i === q.answer) el.classList.add('correct');
  });
  showExplanation(q.expl);
  showNext();
}

function showExplanation(text) {
  const card = document.querySelector('.card');
  const exp = document.createElement('div');
  exp.className = 'explanation';
  exp.textContent = '💡 ' + text;
  card.appendChild(exp);
}

function showNext() {
  const btn = document.createElement('button');
  btn.className = 'next-btn';
  btn.textContent = current < shuffled.length - 1 ? 'Question suivante →' : 'Voir mes résultats';
  btn.onclick = () => {
    current++;
    answered = false;
    render();
  };
  document.querySelector('.card').appendChild(btn);
}

function render() {
  const app = document.getElementById('app');
  if (current >= shuffled.length) {
    clearInterval(timerInterval);
    renderScore(app);
    return;
  }
  const q = shuffled[current];
  const pct = (current / shuffled.length) * 100;
  app.innerHTML = `
    <div class="progress-info">
      <span>Question ${current + 1} / ${shuffled.length}</span>
      <div class="timer"><div class="timer-dot"></div><span id="timer">20s</span></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="category-tag">${q.category}</div>
      <div class="question">${q.q}</div>
      <div class="options">
        ${q.options.map((opt, i) => `
          <div class="option" data-i="${i}" onclick="choose(${i})">
            <div class="option-letter">${letters[i]}</div>
            <div class="option-text">${opt}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  startTimer();
}

function choose(i) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);
  const q = shuffled[current];
  const opts = document.querySelectorAll('.option');
  opts.forEach(el => el.classList.add('disabled'));
  opts[i].classList.add(i === q.answer ? 'correct' : 'wrong');
  if (i === q.answer) {
    score++;
  } else {
    opts[q.answer].classList.add('correct');
  }
  showExplanation(q.expl);
  showNext();
}

async function checkAchievements(gamesPlayed, pts, pct) {
  const stored = JSON.parse(localStorage.getItem('qw_achievements') || '[]');
  const streak = parseInt(localStorage.getItem('qw_streak') || '0');
  const newOnes = [];

  for (const a of ACHIEVEMENTS) {
    if (!stored.includes(a.id) && a.check(gamesPlayed, pts, streak, pct, pts)) {
      stored.push(a.id);
      newOnes.push(a);
    }
  }

  localStorage.setItem('qw_achievements', JSON.stringify(stored));
  return newOnes;
}

async function saveScore(pts, correct, total) {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;

  await sb.from('scores').insert({
    user_id: user.id, subject: "Afrique & Histoire",
    score: pts, correct, total_q: total, difficulty: 'normal'
  });

  const { data: profil } = await sb.from('profiles').select('*').eq('user_id', user.id).single();
  if (profil) {
    const newStreak = correct === total ? (parseInt(localStorage.getItem('qw_streak')||0)+1) : 0;
    localStorage.setItem('qw_streak', newStreak);
    await sb.from('profiles').update({
      total_score:  profil.total_score + pts,
      games_played: profil.games_played + 1,
      best_score:   Math.max(profil.best_score, pts),
      correct_pct:  Math.round((correct/total)*100)
    }).eq('user_id', user.id);
    return { gamesPlayed: profil.games_played + 1, streak: newStreak };
  }
  return { gamesPlayed: 1, streak: 0 };
}

async function renderScore(app) {
  const pct = Math.round((score / shuffled.length) * 100);
  const pts = score * 100;
  let emoji = '🥲', msg = 'Pas de chance...';
  if (pct >= 80) { emoji = '🏆'; msg = 'Excellent ! Bravo !'; }
  else if (pct >= 60) { emoji = '😎'; msg = 'Très bien joué !'; }
  else if (pct >= 40) { emoji = '🙂'; msg = 'Pas mal, continuez !'; }

  // Save and check achievements
  const result = await saveScore(pts, score, shuffled.length);
  const newAchievements = result ? await checkAchievements(result.gamesPlayed, pts, pct) : [];

  const achievHTML = newAchievements.length > 0 ? `
    <div style="background:rgba(245,200,66,0.08);border:1.5px solid rgba(245,200,66,0.25);border-radius:14px;padding:16px;margin-bottom:20px;text-align:left">
      <div style="font-size:0.75rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#f5c842;margin-bottom:10px">🎉 Nouveaux trophées débloqués !</div>
      ${newAchievements.map(a=>`
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <span style="font-size:1.5rem">${a.icon}</span>
          <div>
            <div style="font-weight:700;font-size:0.88rem">${a.name}</div>
            <div style="font-size:0.75rem;color:#9090b0">${a.desc}</div>
          </div>
        </div>`).join('')}
    </div>` : '';

  app.innerHTML = `
    <div class="score-card">
      <span class="score-emoji">${emoji}</span>
      <div class="score-title">${msg}</div>
      <div class="score-subtitle">Quiz terminé · L'Afrique & le Monde</div>
      <div class="score-circle">
        <div class="score-num">${score}</div>
        <div class="score-denom">sur ${shuffled.length}</div>
      </div>
      <div style="color:var(--muted);font-size:0.9rem;margin-bottom:24px;">${pct}% · ${pts} points</div>
      ${achievHTML}
      <button class="restart-btn" onclick="restart()" style="margin-bottom:12px">↺ Rejouer</button>
      <button onclick="window.location.href='index.html'" style="display:block;width:100%;padding:14px;background:rgba(255,255,255,0.06);border:1.5px solid #2a2a3d;border-radius:12px;color:#e8e4f0;font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:500;cursor:pointer;margin-bottom:10px">🏠 Accueil</button>
      <button onclick="window.location.href='quizworld-auth.html'" style="display:block;width:100%;padding:14px;background:rgba(255,255,255,0.04);border:1.5px solid #2a2a3d;border-radius:12px;color:#7a7a9a;font-family:'DM Sans',sans-serif;font-size:0.88rem;cursor:pointer">👤 Mon profil</button>
    </div>
  `;
}

function restart() {
  shuffled.sort(() => Math.random() - 0.5);
  current = 0; score = 0; answered = false;
  render();
}

render();
</script>
</body>
</html>
